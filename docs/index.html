---
---
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assam Rolls 2026</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #faf9f5;
    --ink: #1e2630;
    --muted: #5a6472;
    --line: #d9d6cc;
    --accent: #3d5a99;
    --card: #f1efe8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14181f;
      --ink: #e6e4dd;
      --muted: #97a0ad;
      --line: #313945;
      --accent: #84a3de;
      --card: #1c222b;
    }
  }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.6 "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  main { max-width: 50rem; margin: auto; padding: 3rem 1.25rem 5rem; }
  h1, h2, h3 { line-height: 1.2; text-wrap: balance; }
  h1 { font-size: 2.1rem; }
  h2 { margin-top: 2.6rem; }
  p, li { max-width: 70ch; }
  a { color: var(--accent); }
  code, pre, table {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .86em;
  }
  pre {
    overflow-x: auto;
    padding: 1rem;
    border: 1px solid var(--line);
    background: var(--card);
  }
  table { display: block; overflow-x: auto; border-collapse: collapse; }
  th, td { padding: .4rem .8rem; border-bottom: 1px solid var(--line); text-align: left; }
  blockquote { margin-left: 0; padding-left: 1rem; border-left: 3px solid var(--accent); color: var(--muted); }
</style>
</head>
<body>
<main>
{% capture report %}{% include_relative EXTRACTION_REPORT.md %}{% endcapture %}
{{ report | markdownify }}
</main>
</body>
</html>
