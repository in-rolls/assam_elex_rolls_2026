name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # poppler renders the pages; tesseract reads them. The image-driven tests skip
      # cleanly when these are absent, but installing them is what makes CI meaningful.
      - name: Install poppler and tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: make PY=python lint

      - name: Test
        run: make PY=python test
