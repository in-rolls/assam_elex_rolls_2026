[project]
name = "assam-rolls"
version = "0.1.0"
description = "Parse Assam 2026 electoral roll info pages into a part-level dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
keywords = ["electoral-rolls", "india", "assam", "ocr", "elections", "polling-stations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "anthropic>=0.40",
    # electors/grid.py projects ink with it to find the rules and the text bands.
    "numpy>=1.24",
    "pillow>=10",
    "pyarrow>=15",
]

[project.optional-dependencies]
romanize = ["aksharamukha>=2.1"]
dev = [
    "pytest>=8",
    "black>=24",
    "isort>=5",
    "flake8>=7",
]

[project.urls]
Homepage = "https://github.com/in-rolls/assam_elex_rolls_2026"
Repository = "https://github.com/in-rolls/assam_elex_rolls_2026"

[project.scripts]
assam-rolls = "assam_rolls.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assam_rolls*", "electors*", "romanize*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
